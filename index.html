<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>産婦人科当直表</title>
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<!--
  画面の文言は app.js の先頭の「文言の一覧」（TEXT）にまとめてある。
  ここでは data-t（文字）・data-t-ph（薄い字の例）・data-t-aria（読み上げ用の名前）でその一覧のキーを指すだけ。
-->
<div class="wrap">
  <header class="topbar">
    <h1 data-t="appTitle"></h1>
    <span class="badge" id="edit-badge" data-t="badgeEditing" hidden></span>
    <button type="button" class="menu-btn" id="menu-btn" data-t-aria="menu" aria-expanded="false" aria-controls="menu">
      <span></span><span></span><span></span>
    </button>
    <nav class="menu" id="menu" hidden>
      <button type="button" id="m-login" data-t="menuLogin"></button>
      <button type="button" id="m-calendar" data-t="menuCalendar"></button>
      <button type="button" id="m-offs" data-t="menuOffs"></button>
      <button type="button" id="m-master" data-t="menuMaster" hidden></button>
      <button type="button" id="m-conditions" data-t="menuConditions" hidden></button>
      <button type="button" id="m-logout" data-t="menuLogout" hidden></button>
    </nav>
  </header>

  <!-- カレンダー（#calendar） -->
  <section id="view-calendar" class="view">
    <div class="month-nav">
      <button type="button" id="prev" data-t-aria="prevMonth">◀</button>
      <div class="month-title"><span id="cal-title" data-t="appTitle"></span><span id="cal-label"></span></div>
      <button type="button" id="next" data-t-aria="nextMonth">▶</button>
    </div>
    <div class="status-row" id="cal-off-row" hidden><button type="button" class="off-status" id="cal-off-status"></button></div>
    <div class="legend"><b data-t="legendDuty"></b><span data-t="legendSep"></span><span data-t="legendStandby"></span></div>
    <div class="msg" id="cal-msg" role="status"></div>
    <table class="grid" data-t-aria="appTitle">
      <thead><tr class="week-head"></tr></thead>
      <tbody id="grid-body"></tbody>
    </table>

    <div class="result-line" id="result-line" hidden></div>
    <div class="actions">
      <button type="button" class="btn primary" id="ai-btn" hidden></button>
      <button type="button" class="btn" id="pdf-btn" data-t="pdfMake"></button>
      <div class="pdf-box" id="pdf-box" hidden>
        <a class="btn" id="pdf-open" target="_blank" rel="noopener" data-t="pdfOpen"></a>
        <button type="button" class="btn" id="pdf-share" data-t="pdfShare" hidden></button>
      </div>
      <div class="msg" id="pdf-msg"></div>
    </div>

    <div class="checks" id="checks" hidden>
      <h2 data-t="checksTitle"></h2>
      <div id="checks-body"></div>
    </div>

    <h2 data-t="summaryTitle"></h2>
    <div class="summary-wrap">
      <table class="summary" id="summary"></table>
    </div>
  </section>

  <!-- 担当医マスタ（#master。編集モードだけ） -->
  <section id="view-master" class="view" hidden>
    <h2 class="page-title" data-t="menuMaster"></h2>
    <div class="msg" id="master-msg" role="status"></div>
    <div id="master-list"></div>
    <button type="button" class="btn" id="doc-add" data-t="doctorAdd"></button>
    <div class="holiday-box">
      <h3 data-t="holidayTitle"></h3>
      <button type="button" class="btn sub" id="holiday-btn" data-t="holidayRefresh"></button>
      <div class="msg" id="holiday-msg"></div>
    </div>
  </section>

  <!-- 休み希望（#offs。合言葉なしで使える。v8） -->
  <section id="view-offs" class="view" hidden>
    <div class="month-nav">
      <button type="button" id="off-prev" data-t-aria="prevMonth">◀</button>
      <div class="month-title"><span data-t="menuOffs"></span><span id="off-label"></span></div>
      <button type="button" id="off-next" data-t-aria="nextMonth">▶</button>
    </div>
    <div class="status-row"><button type="button" class="off-status" id="off-status" disabled></button></div>
    <div class="off-names" id="off-names" role="group" data-t-aria="offNamesAria"></div>
    <div class="msg" id="off-msg" role="status"></div>
    <table class="grid off-grid" id="off-grid" data-t-aria="menuOffs">
      <thead><tr class="week-head"></tr></thead>
      <tbody id="off-body"></tbody>
    </table>
    <div class="off-count" id="off-count"></div>
    <div class="off-all" id="off-all" hidden></div>
  </section>

  <!-- 全体の条件（#conditions。編集モードだけ。v6） -->
  <section id="view-conditions" class="view" hidden>
    <h2 class="page-title with-help"><span data-t="menuConditions"></span><button type="button" class="help-btn" data-help="help-conditions" data-t-aria="helpOpen" aria-expanded="false">？</button></h2>
    <div class="help-box" id="help-conditions" data-t="helpConditions" hidden></div>
    <div class="msg" id="cond-msg" role="status"></div>
    <div id="cond-list"></div>
    <button type="button" class="btn" id="cond-add" data-t="condAddButton"></button>
  </section>
</div>

<!-- 日を押したとき（下から出るシート） -->
<div class="sheet-back" id="day-back" hidden></div>
<div class="sheet" id="day-sheet" role="dialog" aria-modal="true" aria-labelledby="day-title" hidden>
  <div class="sheet-head">
    <h2 id="day-title"></h2>
    <button type="button" class="close-btn" id="day-close" data-t-aria="close">×</button>
  </div>
  <div class="sheet-body" id="day-body"></div>
</div>

<!-- 担当医の編集 -->
<div class="sheet-back" id="doc-back" hidden></div>
<div class="sheet" id="doc-sheet" role="dialog" aria-modal="true" aria-labelledby="doc-title" hidden>
  <div class="sheet-head">
    <h2 id="doc-title"></h2>
    <button type="button" class="close-btn" id="doc-close" data-t-aria="close">×</button>
  </div>
  <form class="sheet-body form" id="doc-form" autocomplete="off" novalidate>
    <div class="field"><label for="f-name" data-t="fName"></label><input type="text" id="f-name" maxlength="20"></div>
    <div class="field"><label for="f-kind" data-t="fKind"></label>
      <select id="f-kind"><option>上級医</option><option>下級医</option><option>代務医</option></select></div>
    <div class="field"><label for="f-order" data-t="fOrder"></label><input type="number" id="f-order" inputmode="numeric" min="0"></div>
    <div class="field checks-row">
      <label class="check"><input type="checkbox" id="f-active"><span data-t="fActive"></span></label>
      <label class="check"><input type="checkbox" id="f-excluded"><span data-t="fExcluded"></span></label>
      <label class="check"><input type="checkbox" id="f-priority"><span data-t="fPriority"></span></label>
    </div>
    <div class="field" id="f-pair-box">
      <label class="check"><input type="checkbox" id="f-pair"><span data-t="fJuniorPair"></span></label>
    </div>
    <fieldset class="field"><legend data-t="fDutyDays"></legend><div class="days" id="f-duty-days"></div>
      <label class="check"><input type="checkbox" id="f-prehol"><span data-t="fPreHoliday"></span></label></fieldset>
    <div class="field"><label for="f-duty-max" data-t="fDutyMax"></label><input type="number" id="f-duty-max" inputmode="numeric" min="0"></div>
    <fieldset class="field" id="f-standby-box"><legend data-t="fStandbyDays"></legend><div class="days" id="f-standby-days"></div></fieldset>
    <div class="field" id="f-standby-max-box"><label for="f-standby-max" data-t="fStandbyMax"></label><input type="number" id="f-standby-max" inputmode="numeric" min="0" data-t-ph="phNoLimit"></div>
    <div class="field">
      <div class="label-row"><label for="f-note" data-t="fNote"></label><button type="button" class="help-btn" data-help="help-note" data-t-aria="helpOpen" aria-expanded="false">？</button></div>
      <div class="help-box" id="help-note" data-t="helpNote" hidden></div>
      <textarea id="f-note" rows="3" maxlength="300"></textarea>
      <div class="msg err" id="f-note-blocked" data-t="noteBlocked" hidden></div></div>
    <button type="submit" class="btn primary" id="doc-save" data-t="save"></button>
    <div class="msg" id="doc-msg"></div>
  </form>
</div>

<!-- 全体の条件の編集 -->
<div class="sheet-back" id="cond-back" hidden></div>
<div class="sheet" id="cond-sheet" role="dialog" aria-modal="true" aria-labelledby="cond-title" hidden>
  <div class="sheet-head">
    <h2 id="cond-title"></h2>
    <button type="button" class="close-btn" id="cond-close" data-t-aria="close">×</button>
  </div>
  <form class="sheet-body form" id="cond-form" autocomplete="off" novalidate>
    <div class="field"><label for="cf-text" data-t="cfText"></label><textarea id="cf-text" rows="4" maxlength="200" data-t-ph="phCondition"></textarea></div>
    <div class="field"><label for="cf-order" data-t="fOrder"></label><input type="number" id="cf-order" inputmode="numeric" min="0"></div>
    <button type="submit" class="btn primary" data-t="save"></button>
    <div class="msg" id="cf-msg"></div>
  </form>
</div>

<!-- 合言葉 -->
<div class="sheet-back" id="login-back" hidden></div>
<div class="modal" id="login-box" role="dialog" aria-modal="true" aria-labelledby="login-title" hidden>
  <form id="login-form" autocomplete="off" novalidate>
    <h2 id="login-title" data-t="menuLogin"></h2>
    <label for="login-pass" data-t="passLabel"></label>
    <input type="password" id="login-pass" autocomplete="off">
    <div class="msg" id="login-msg" role="status"></div>
    <div class="modal-actions">
      <button type="button" class="btn sub" id="login-cancel" data-t="cancel"></button>
      <button type="submit" class="btn primary" id="login-ok" data-t="loginOk"></button>
    </div>
  </form>
</div>

<!-- 「シフトを作る」の確認（v8） -->
<div class="sheet-back" id="make-back" hidden></div>
<div class="modal" id="make-box" role="dialog" aria-modal="true" aria-labelledby="make-text" hidden>
  <p id="make-text" class="make-text"></p>
  <div class="modal-col">
    <button type="button" class="btn primary" id="make-close" data-t="makeCloseAndGo"></button>
    <button type="button" class="btn" id="make-go" data-t="makeGo"></button>
    <button type="button" class="btn sub" id="make-cancel" data-t="cancel"></button>
  </div>
</div>

<!-- 作成中 -->
<div class="busy" id="busy" hidden>
  <div class="busy-box" role="status"><div class="spinner" aria-hidden="true"></div><p id="busy-text"></p></div>
</div>

<script src="config.js?v=2"></script>
<script src="app.js?v=6"></script>
</body>
</html>
